version: '3'

services:
    crawls_redis:
        container_name: crawls_redis
        image: redis:alpine
        expose:
          - 6379
        ports:
          - 6379:6379 # Public port để lát nữa test multiple worker
        restart: unless-stopped
    crawls_redis_commander:
        container_name: crawls_redis_commander
        image: rediscommander/redis-commander:latest
        environment:
          - REDIS_HOSTS=local:crawls_redis:6379
        ports:
          - '8088:8081'
        depends_on:
          - crawls_redis

networks:
  webnet:
